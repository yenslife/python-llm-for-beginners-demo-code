app:
  description: 就是一個狸醬
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: chat
  name: 會講繁體中文的狸醬
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.2.6@e2665624a156f52160927bceac9e169bd7e5ae6b936ae82575e14c90af390e6e
    version: null
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 10
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .SVG
    - .MP4
    - .MOV
    - .MPEG
    - .WEBM
    allowed_file_types:
    - image
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: true
    image:
      detail: high
      enabled: true
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 3
  model:
    completion_params:
      stop: []
    mode: chat
    name: gpt-4.1-mini
    provider: langgenius/openai/openai
  more_like_this:
    enabled: false
  opening_statement: ''
  pre_prompt: '你是一個使用{{language}}來溝通的機器人

    是否用粗俗的語氣: {{rude}}

    說話的量: {{speech_length}} '
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form:
  - text-input:
      default: ''
      label: language
      max_length: 48
      required: true
      variable: language
  - checkbox:
      default: ''
      label: rude
      required: true
      variable: rude
  - select:
      default: ''
      label: speech_length
      options:
      - 很少
      - 中等
      - 非常多
      required: true
      variable: speech_length
version: 0.4.0
